[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshotinone"
version = "0.2.0"
description = "Quietly sync Steam screenshots to Netclip, cloud folders, and Steam Community."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sskift"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Utilities",
]

[project.optional-dependencies]
steam = ["websocket-client>=1.8,<2"]

[project.scripts]
screenshotinone = "screenshotinone.cli:main"

[project.urls]
Repository = "https://github.com/Sskift/screenshotinone"
Issues = "https://github.com/Sskift/screenshotinone/issues"

[tool.setuptools.packages.find]
include = ["screenshotinone*"]
